<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTOSO-GRID - Maillist Filter</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h1>SANTOSO<span>-GRID</span></h1>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item">
                    <span class="icon">📊</span>
                    Dashboard
                </a>
                <a href="/send" class="nav-item">
                    <span class="icon">✉️</span>
                    Send Email
                </a>
                <a href="/proxy" class="nav-item">
                    <span class="icon">🔄</span>
                    Proxy Checker
                </a>
                <a href="/filter" class="nav-item active">
                    <span class="icon">🔍</span>
                    Maillist Filter
                </a>
                <a href="/templates" class="nav-item">
                    <span class="icon">📝</span>
                    Templates
                </a>
            </nav>
            <div class="server-status">
                <div class="status-indicator online"></div>
                <span>Server Online</span>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Maillist Filter</h2>
            </header>
            
            <!-- Maillist Input -->
            <div class="filter-section">
                <div class="form-group">
                    <label>Paste Email List</label>
                    <textarea id="emailList" class="form-textarea large" placeholder="Paste email addresses here...&#10;One email per line&#10;&#10;Example:&#10;test1@gmail.com&#10;test2@yahoo.com&#10;test3@outlook.com&#10;test4@company.com"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Filter by Domain</label>
                    <input type="text" id="filterDomains" class="form-input" placeholder="@gmail.com, @yahoo.com, @outlook.com">
                    <p class="help-text">Separate domains with commas</p>
                </div>
                
                <div class="form-actions">
                    <label class="file-label">
                        <input type="file" id="emailFile" accept=".txt,.csv" hidden>
                        <span class="btn btn-secondary">📁 Upload File</span>
                    </label>
                    <button class="btn btn-primary" onclick="filterEmails()">
                        🔍 Apply Filter
                    </button>
                </div>
            </div>
            
            <!-- Filter Actions -->
            <div class="filter-actions">
                <button class="btn btn-outline" onclick="selectAllDomains()">✓ Select All</button>
                <button class="btn btn-outline" onclick="deselectAllDomains()">✗ Deselect All</button>
                <button class="btn btn-success" onclick="downloadSelected()">
                    ⬇️ Download Selected
                </button>
            </div>
            
            <!-- Results -->
            <div class="filter-results">
                <h3>Domain Results</h3>
                <div class="domain-list" id="domainList">
                    <div class="empty-state">
                        <p>No domains found. Upload an email list and apply filter.</p>
                    </div>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="filter-stats">
                <div class="stat-box">
                    <span class="stat-number" id="totalEmails">0</span>
                    <span class="stat-label">Total Emails</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="filteredEmails">0</span>
                    <span class="stat-label">After Filter</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="uniqueDomains">0</span>
                    <span class="stat-label">Unique Domains</span>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/filter.js"></script>
</body>
</html>
